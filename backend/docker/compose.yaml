x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true

x-app-security: &app-security
  read_only: true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  pids_limit: 256

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  API_CONTAINER_PORT: ${KEYSTONE_API_CONTAINER_PORT:-3000}
  DATABASE_URL: postgresql://${RUNTIME_DATABASE_USER:-keystone_runtime}:${RUNTIME_DATABASE_PASSWORD:-fixture-runtime-password-only}@postgres:5432/${POSTGRES_DB:-keystone}
  QUEUE_URL: redis://queue:6379/0
  QUEUE_STREAM: ${QUEUE_STREAM:-keystone_jobs_v1}
  QUEUE_CONSUMER_GROUP: ${QUEUE_CONSUMER_GROUP:-keystone_workers_v1}
  QUEUE_CLAIM_IDLE_MS: ${QUEUE_CLAIM_IDLE_MS:-30000}
  QUEUE_BLOCK_MS: ${QUEUE_BLOCK_MS:-5000}
  WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3001}
  DEMO_TENANT_ID: ${DEMO_TENANT_ID:-00000000-0000-4000-8000-000000000002}
  DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-demo-school-10pct}
  DEMO_CLIENT_KEY: ${DEMO_CLIENT_KEY:-fixture-demo-client-key-only}
  DEMO_REVIEWER_KEY: ${DEMO_REVIEWER_KEY:-fixture-demo-reviewer-key-only}
  SYNC_TRIGGER_SECRET: ${SYNC_TRIGGER_SECRET:-fixture-sync-trigger-secret-only}
  RECONCILE_TRIGGER_SECRET: ${RECONCILE_TRIGGER_SECRET:-fixture-reconcile-trigger-secret-only}
  STRETCH_TRIGGER_SECRET: ${STRETCH_TRIGGER_SECRET:-fixture-stretch-trigger-secret-only}
  REQUEST_BODY_LIMIT_BYTES: ${REQUEST_BODY_LIMIT_BYTES:-1048576}
  SOURCE_RECORD_LIMIT_BYTES: ${SOURCE_RECORD_LIMIT_BYTES:-262144}
  SOURCE_TIMEOUT_MS: ${SOURCE_TIMEOUT_MS:-5000}
  SOURCE_RETRY_LIMIT: ${SOURCE_RETRY_LIMIT:-2}
  JOB_RETRY_LIMIT: ${JOB_RETRY_LIMIT:-3}
  JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-10000}
  DAILY_SPEND_CAP_MICROCENTS: ${DAILY_SPEND_CAP_MICROCENTS:-1000000}
  PER_RUN_SPEND_CAP_MICROCENTS: ${PER_RUN_SPEND_CAP_MICROCENTS:-500000}
  PROVIDER_MODE: ${PROVIDER_MODE:-local}
  PROVIDER_MODEL: ${PROVIDER_MODEL:-keystone-deterministic-v1}
  PRICE_TABLE_VERSION: ${PRICE_TABLE_VERSION:-prices-v1}
  CANONICAL_SEED: ${CANONICAL_SEED:-424242}
  FIXTURE_ROOT: ${FIXTURE_ROOT:-/app/fixtures/generated}
  MIGRATIONS_ROOT: /app/database/migrations
  CONFIG_ROOT: /app/config
  LOG_PRIVACY_MODE: ${LOG_PRIVACY_MODE:-redacted}
  LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
  OSCILLATION_HOLD_THRESHOLD: ${OSCILLATION_HOLD_THRESHOLD:-3}
  RECONCILE_SCHEDULE_MS: ${RECONCILE_SCHEDULE_MS:-86400000}

services:
  init:
    build:
      context: ../..
      dockerfile: backend/services/api/Dockerfile
    image: keystone-api:local
    restart: "no"
    init: true
    <<: *app-security
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-keystone_owner}:${POSTGRES_PASSWORD:-fixture-owner-password-only}@postgres:5432/${POSTGRES_DB:-keystone}
      RUNTIME_DATABASE_USER: ${RUNTIME_DATABASE_USER:-keystone_runtime}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:-fixture-runtime-password-only}
    command: ["node", "dist/cli/init.js"]
    mem_limit: 1536m
    cpus: 2.0

  api:
    build:
      context: ../..
      dockerfile: backend/services/api/Dockerfile
    image: keystone-api:local
    <<: [*service-defaults, *app-security]
    depends_on:
      init:
        condition: service_completed_successfully
      queue:
        condition: service_healthy
    environment:
      <<: *runtime-environment
    ports:
      - "${API_PORT:-3000}:${KEYSTONE_API_CONTAINER_PORT:-3000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.API_CONTAINER_PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 768m
    cpus: 1.0

  worker:
    image: keystone-api:local
    <<: [*service-defaults, *app-security]
    depends_on:
      init:
        condition: service_completed_successfully
      queue:
        condition: service_healthy
    environment:
      <<: *runtime-environment
    command: ["node", "dist/worker/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 1536m
    cpus: 2.0

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_DEMO_CLIENT_KEY: ${DEMO_REVIEWER_KEY:-fixture-demo-reviewer-key-only}
    image: keystone-frontend:local
    <<: *service-defaults
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4173}:${FRONTEND_CONTAINER_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/frontend-health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    <<: *service-defaults
    command: ["postgres", "-c", "max_wal_size=4GB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keystone}
      POSTGRES_USER: ${POSTGRES_USER:-keystone_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixture-owner-password-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    cpus: 2.0

  queue:
    image: ${QUEUE_IMAGE:-redis:7-alpine}
    <<: *service-defaults
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: 0.5

volumes:
  postgres_data:
  queue_data:
