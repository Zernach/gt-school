x-service-defaults: &service-defaults
  restart: unless-stopped

services:
  api:
    # Replace API_IMAGE with an image for the language/framework you choose, or
    # replace this with `build: ../services/api` once
    # backend/services/api contains a Dockerfile.
    image: ${API_IMAGE:-traefik/whoami:v1.10}
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      queue:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-app}
      DATABASE_USER: ${POSTGRES_USER:-app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-app}
      QUEUE_URL: redis://queue:6379/0
    ports:
      - "${API_PORT:-8080}:${API_CONTAINER_PORT:-80}"

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    <<: *service-defaults
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  queue:
    image: ${QUEUE_IMAGE:-redis:7-alpine}
    <<: *service-defaults
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  queue_data:
